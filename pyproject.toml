[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "loghunt"
dynamic = ["version"]
description = "Hunt bots, scanners and botnets in nginx/apache access logs. Every flag comes with a reason."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thanut Jongteerathanachote" }]
keywords = ["security", "access-log", "nginx", "apache", "botnet", "incident-response", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
loghunt = "loghunt.cli:main"

[project.urls]
Homepage = "https://github.com/winxtxrgit/loghunt"
Issues = "https://github.com/winxtxrgit/loghunt/issues"

[tool.hatch.version]
path = "src/loghunt/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "samples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
